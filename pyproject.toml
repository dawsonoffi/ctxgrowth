[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dawsonoffi-ctxgrowth"
version = "0.1.0"
description = "按来源分段统计上下文的增长贡献，标出膨胀最快的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dawsonoffi" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dawsonoffi.github.io"
Repository = "https://github.com/dawsonoffi/ctxgrowth"
Issues = "https://github.com/dawsonoffi/ctxgrowth/issues"

[project.scripts]
ctxgrowth = "ctxgrowth:main"

[tool.setuptools]
py-modules = ["ctxgrowth"]
